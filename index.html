<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>115-1 期中複習</title>
<style>
:root { --bg: #f7f6f3; --surface: #fff; --text: #1f2328; --muted: #5d6470; --border: #e2e0da; --accent: #1f5fae; }
@media (prefers-color-scheme: dark) { :root { --bg: #15171a; --surface: #1d2024; --text: #e6e6e3; --muted: #9aa1ab; --border: #2f343a; --accent: #7fb0ec; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.7 "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 640px; margin: 0 auto; }
h1 { font-size: 24px; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 20px; }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
/* 每科一個框；已完成的科目整個框都是連結 */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; color: inherit; text-decoration: none; }
a.card { transition: border-color .15s, background-color .15s; }
a.card .name { color: var(--accent); font-weight: 600; }
a.card .name::after { content: " →"; }
a.card:hover, a.card:focus-visible { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.date { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.soon { color: var(--muted); }
.foot { font-size: 13px; margin: 24px 0 0; }
</style>
<script>
// 瀏覽次數統計（GoatCounter）：只記路徑，?openExternalBrowser=1 等參數不拆成另一頁
window.goatcounter = { path: function () { return location.pathname } };
</script>
<script data-goatcounter="https://study1151.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <h1>115-1 期中複習</h1>
  <p>每科講義都有加密，請輸入課程 LINE 群組公布的密碼。</p>
  <ul>
    <li><a class="card" href="dynamics/"><span class="name">動力學</span><span class="date">11/3（二）09:00</span></a></li>
    <li><div class="card"><span class="soon">量子力學（準備中）</span><span class="date">11/3（二）15:10</span></div></li>
    <li><div class="card"><span class="soon">工程數學（準備中）</span><span class="date">11/5（四）08:30</span></div></li>
    <li><div class="card"><span class="soon">雲端生產數據導論（準備中）</span><span class="date">11/6（五）15:10</span></div></li>
  </ul>
  <p class="foot">本站用 GoatCounter 統計瀏覽次數，不使用 cookie，也不記錄是誰在看。</p>
</main>

</html>
