<title>量子力學期中複習</title>
<style>
:root { --bg: #f7f6f3; --surface: #fff; --text: #1f2328; --muted: #5d6470; --border: #e2e0da; --accent: #1f5fae; --bad: #b42318; }
@media (prefers-color-scheme: dark) { :root { --bg: #15171a; --surface: #1d2024; --text: #e6e6e3; --muted: #9aa1ab; --border: #2f343a; --accent: #7fb0ec; --bad: #f08080; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
  font: 16px/1.6 "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", system-ui, sans-serif; padding: 16px; }
form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
h1 { font-size: 20px; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 14px; }
.pwrow { display: flex; gap: 6px; }
.pwrow input { flex: 1; min-width: 0; }
.eye { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 0 12px; white-space: nowrap; }
input[type=password], input[type=text] { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
button { font: inherit; padding: 10px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--bad); font-size: 14px; min-height: 1.4em; }
</style>

async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(DATA.iv) }, key, ub(DATA.body));
  return new TextDecoder().decode(plain);

  let n = 0;
  (function wait() {
    const g = window.goatcounter;
    if (g && g.count) { try { g.count({ path, title, event: true }); } catch (x) {} }
    else if (++n < 15) { setTimeout(wait, 100); return; }
    if (then) then();
  })();
}
// 解密成功時記一次事件，再換成講義；手動輸入和「記住密碼」自動開啟分開記
function show(html, auto) {
  count(auto ? 'unlock-auto-quantum' : 'unlock-quantum', auto ? '量子力學：自動解鎖（記住密碼）' : '量子力學：解密成功',
    () => { document.open(); document.write(html); document.close(); });
}
let wrongSent = false; // 密碼錯誤只記一次，不記打了什麼
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
// 顯示／隱藏密碼
const pwBox = document.getElementById('pw'), eye = document.getElementById('eye');
eye.addEventListener('click', () => {
  const show = pwBox.type === 'password';
  pwBox.type = show ? 'text' : 'password';
  eye.textContent = show ? '隱藏' : '顯示';
  eye.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
  eye.setAttribute('aria-pressed', String(show));
  pwBox.focus();
});
f.addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if (!window.crypto || !crypto.subtle) { err.textContent = '這個瀏覽器無法解密，請用 Chrome、Safari 或 Edge 開啟 https 網址。'; return; }
  go.disabled = true; go.textContent = '解密中…'; err.textContent = '';
  try {
    const html = await unlock(pw);
    try { if (document.getElementById('keep').checked) localStorage.setItem('dyn-pw', pw); } catch (x) {}
    show(html);
  } catch (x) {
    err.textContent = '密碼不對，請再確認一次。';
    go.disabled = false; go.textContent = '開啟講義';
    if (!wrongSent) { wrongSent = true; count('pw-wrong-quantum', '量子力學：密碼錯誤'); }
  }
});
(async () => { // 記住密碼的裝置直接開
  let pw = null; try { pw = localStorage.getItem('dyn-pw'); } catch (x) {}
  if (!pw) return;
  try { show(await unlock(pw), true); } catch (x) { try { localStorage.removeItem('dyn-pw'); } catch (y) {} }
})();
})();
</script>
